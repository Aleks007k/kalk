name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Тег версии для публикации в Releases (например, v0.1.0)"
        required: false
        default: "v0.1.0"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Пустой список: не ставим устаревший пакет "tools" (его больше нет
          # и он валит шаг). Нужные пакеты ставим следующим шагом.
          packages: ""

      - name: Install SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --stacktrace

      - name: Prepare signing key (optional)
        env:
          KS: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "Сборка будет подписана основным ключом."
          else
            echo "Секрет ключа не задан — релиз подписывается отладочным ключом."
          fi

      - name: Build release APK
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Calculator.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-apk
          path: dist/Calculator.apk
          if-no-files-found: error

      - name: Publish release (version tag or manual run)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Calculator.apk
          # По тегу — имя тега; по ручному запуску — тег из поля ввода.
          # Если тега ещё нет, GitHub создаёт его сам из текущего коммита.
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: |
            Установочный файл калькулятора (этап 1, тестовая подпись).
            Скачайте **Calculator.apk** ниже и установите на телефон
            (инструкция — в README репозитория).
